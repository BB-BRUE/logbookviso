<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logbook Viso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <p class="brand-mark">Logbook Viso</p>
        <p class="brand-sub">Törn-Tracks aus dem Logbuch</p>
      </header>

      <label class="field">
        <span>Törn</span>
        <select id="toernSelect" disabled>
          <option>Lade Törns…</option>
        </select>
      </label>

      <div id="toernMeta" class="meta" hidden></div>

      <section class="legend">
        <h2>Status</h2>
        <ul id="statusLegend"></ul>
        <p class="hint">Größere Punkte = manuelle Einträge (recordtype 1)</p>
      </section>

      <label class="field field-check">
        <input type="checkbox" id="showPhotos" checked />
        <span>Fotos auf der Karte</span>
      </label>
      <p id="photoInfo" class="hint photo-info">Fotos: —</p>

      <form id="photoUpload" class="upload-form">
        <h2>Fotos hochladen</h2>
        <p class="hint upload-hint">GPS aus EXIF oder Koordinaten unten. Ohne beides: Zuordnung per Aufnahmezeit zum Track.</p>
        <label class="field">
          <span>Dateien</span>
          <input type="file" id="photoFiles" name="photos" accept="image/*" multiple required />
        </label>
        <label class="field">
          <span>Titel (optional)</span>
          <input type="text" id="photoTitle" name="title" placeholder="z. B. Ankerplatz Punat" />
        </label>
        <div class="coord-row">
          <label class="field">
            <span>LAT (optional)</span>
            <input type="text" id="photoLat" name="lat" inputmode="decimal" placeholder="45.002" />
          </label>
          <label class="field">
            <span>LON (optional)</span>
            <input type="text" id="photoLon" name="lon" inputmode="decimal" placeholder="14.607" />
          </label>
        </div>
        <button type="submit" class="btn btn-primary" id="photoUploadBtn">Hochladen</button>
      </form>

      <footer class="sidebar-foot">
        <span id="pointCount">—</span>
        <button type="button" id="fitBtn" class="btn" disabled>Track einpassen</button>
      </footer>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div id="hoverCard" class="hover-card" hidden></div>
      <div id="toast" class="toast" hidden></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/app.js"></script>
</body>
</html>
