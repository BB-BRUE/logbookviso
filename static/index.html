<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logbook Viso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app sidebar-collapsed" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Seitenmenü">
      <header class="brand brand-row">
        <div class="brand-text">
        <p class="brand-mark">Logbook Viso</p>
        <p class="brand-sub">Törn-Tracks aus dem Logbuch</p>
        <p id="userBar" class="user-bar" hidden>
          <span id="userName"></span>
          <button type="button" id="logoutBtn" class="btn btn-link">Abmelden</button>
        </p>
        </div>
        <button type="button" class="btn btn-icon sidebar-close" id="sidebarClose" aria-label="Menü schließen" title="Menü schließen">‹</button>
      </header>

      <label class="field">
        <span>Törn</span>
        <select id="toernSelect" disabled>
          <option>Lade Törns…</option>
        </select>
      </label>

      <button type="button" class="btn btn-primary" id="slideshowBtn" disabled>Diashow (alle Medien)</button>

      <nav class="sidebar-nav" aria-label="Hauptmenü">
        <a href="/photos" class="btn btn-nav" id="managePhotosLink">Fotos bearbeiten</a>
        <a href="/admin" class="btn btn-nav" id="navAdmin" hidden>Benutzer</a>
        <a href="/admin/logbook" class="btn btn-nav" id="navLogbook" hidden>Logbook importieren</a>
      </nav>

      <details class="sidebar-accordion" id="sidebarDetails">
        <summary>Details &amp; Karte</summary>
        <div class="sidebar-accordion-body">
          <div id="toernMeta" class="meta" hidden></div>

          <section class="legend">
            <h2>Status</h2>
            <ul id="statusLegend"></ul>
            <p class="hint">Größere Punkte = manuelle Einträge (recordtype 1)</p>
          </section>

          <label class="field field-check">
            <input type="checkbox" id="showPhotos" checked />
            <span>Medien mit GPS auf der Karte</span>
          </label>
          <label class="field field-check">
            <input type="checkbox" id="showUnlocatedOnly" />
            <span>Nur ohne Koordinaten anzeigen</span>
          </label>
          <p id="photoInfo" class="hint photo-info">Medien: —</p>
          <ul id="unlocatedList" class="unlocated-list" hidden></ul>
        </div>
      </details>

      <footer class="sidebar-foot">
        <span id="pointCount">—</span>
        <button type="button" id="fitBtn" class="btn" disabled>Track einpassen</button>
      </footer>
    </aside>

    <main class="map-wrap">
      <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Menü öffnen" aria-controls="sidebar" aria-expanded="false" title="Menü">☰</button>
      <div id="sidebarBackdrop" class="sidebar-backdrop" hidden aria-hidden="true"></div>
      <div id="map"></div>
      <div id="hoverCard" class="hover-card" hidden></div>
      <div id="toast" class="toast" hidden></div>

      <div id="photoLightbox" class="photo-lightbox" hidden aria-modal="true" role="dialog">
        <button type="button" class="photo-lightbox-close" id="photoLightboxClose" aria-label="Schließen">×</button>
        <button type="button" class="photo-lightbox-nav photo-lightbox-prev" id="photoLightboxPrev" aria-label="Vorheriges Bild">‹</button>
        <button type="button" class="photo-lightbox-nav photo-lightbox-next" id="photoLightboxNext" aria-label="Nächstes Bild">›</button>
        <div class="photo-lightbox-stage">
          <img id="photoLightboxMain" alt="" />
          <video id="photoLightboxVideo" class="photo-lightbox-video" controls playsinline hidden></video>
          <p id="photoLightboxCaption" class="photo-lightbox-caption"></p>
        </div>
        <div class="photo-lightbox-strip-wrap">
          <div id="photoLightboxStrip" class="photo-lightbox-strip"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/auth.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
