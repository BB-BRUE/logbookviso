<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benutzer – Logbook Viso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="manage-body">
  <div class="manage-app">
    <header class="manage-header">
      <div>
        <p class="brand-mark">Benutzerverwaltung</p>
        <p class="brand-sub">Admin: Benutzer anlegen, Törns zuordnen</p>
      </div>
      <div class="header-actions">
        <a href="/" class="btn">← Karte</a>
        <button type="button" class="btn" id="logoutBtn">Abmelden</button>
      </div>
    </header>

    <section class="panel">
      <h2>Neuer Benutzer</h2>
      <form id="createUserForm" class="admin-form">
        <div class="coord-row">
          <label class="field">
            <span>Benutzername</span>
            <input type="text" id="newUsername" required />
          </label>
          <label class="field">
            <span>Passwort</span>
            <input type="password" id="newPassword" required />
          </label>
        </div>
        <label class="field">
          <span>Rolle</span>
          <select id="newRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <label class="field">
          <span>Törns zuordnen</span>
          <p class="hint">Angehakte Törns sind dem Benutzer sichtbar.</p>
          <div id="newToerns" class="admin-toern-picker"></div>
        </label>
        <button type="submit" class="btn btn-primary">Benutzer anlegen</button>
      </form>
    </section>

    <section class="panel">
      <h2>Benutzer</h2>
      <div id="userList" class="admin-user-list"></div>
    </section>

    <div id="toast" class="toast manage-toast" hidden></div>
  </div>
  <script src="/auth.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
