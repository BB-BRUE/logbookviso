services:
  logbookviso:
    container_name: logbookviso
    build: .
    ports:
      - "5000:5000"
    environment:
      LOGBOOK_DB: /data/logbook.sqlite
    volumes:
      # Host-Datei muss existieren; :ro braucht Read-only-Open in der App
      - ./logbook.sqlite:/data/logbook.sqlite:ro
    networks:
      - swag_proxy-net
    restart: unless-stopped

networks:
  swag_proxy-net:
    external: true
