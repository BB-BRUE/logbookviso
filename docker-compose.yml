services:
  logbookviso:
    container_name: logbookviso
    build: .
    ports:
      - "5000:5000"
    environment:
      LOGBOOK_DB: /opt/docker/logbookviso/data/logbook.sqlite
    volumes:
      # SQLite-Datei vom Host einbinden (nur lesen)
      - ./logbook.sqlite:/opt/docker/logbookviso/data/logbook.sqlite:ro
    networks:
      - swag_proxy-net
    restart: unless-stopped

networks:
  swag_proxy-net:
    external: true
