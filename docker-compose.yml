services:
  logbookviso:
    container_name: logbookviso
    build: .
    ports:
      - "5000:5000"
    environment:
      LOGBOOK_DB: /data/logbook.sqlite
      GOOGLE_PHOTOS_CONFIG: /data/google-photos.json
      GOOGLE_PHOTOS_CACHE: /tmp/photos-cache
    volumes:
      # Verzeichnis mounten (zuverlässiger als einzelne Datei).
      # Host: ./data/logbook.sqlite  ->  Container: /data/logbook.sqlite
      - ./data:/data:ro
    networks:
      - swag_proxy-net
    restart: unless-stopped

networks:
  swag_proxy-net:
    external: true
