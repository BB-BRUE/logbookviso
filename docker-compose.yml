services:
  logbookviso:
    container_name: logbookviso
    build: .
    ports:
      - "5000:5000"
    environment:
      LOGBOOK_DB: /data/logbook.sqlite
      PHOTOS_DB: /data/photos.sqlite
      PHOTOS_DIR: /data/photos
      MAX_UPLOAD_MB: "256"
    volumes:
      - ./data:/data
    networks:
      - swag_proxy-net
    restart: unless-stopped

networks:
  swag_proxy-net:
    external: true
